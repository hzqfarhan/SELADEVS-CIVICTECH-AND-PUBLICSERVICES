<!doctype html><html lang="en"><meta charset="utf-8"><title>GERAK — The real app</title>
<style>@font-face{font-family:Space;src:url('../assets/SpaceGrotesk.ttf');font-weight:300 700}@font-face{font-family:DM;src:url('../assets/DMSans.ttf');font-weight:100 1000}body{margin:0;background:#070d1b;display:grid;place-items:center;min-height:100vh}canvas{width:min(100vw,177.777vh);height:auto}video{display:none}#controls{position:fixed;bottom:12px;padding:10px 18px;border-radius:30px;color:#d8e6ff;background:#14223c;font:14px DM}button{background:#5288fb;color:white;border:0;padding:8px 20px;border-radius:20px;cursor:pointer}input{width:280px;vertical-align:middle}</style>
<canvas id="film" width="1920" height="1080"></canvas><div id="controls"><button id="play">Play</button> <input id="seek" type="range" min="0" max="29.96" step=".033" value="0"> <span id="time">0.0 / 30s</span> · Actual GERAK interface</div>
<script>
const cv=document.getElementById('film'),g=cv.getContext('2d',{alpha:false}),W=1920,H=1080;
const C={bg:'#070d1b',white:'#f1f6ff',muted:'#9fb1cc',blue:'#7ba8ff',line:'#30466a'};
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-(1-clamp(x))**3,sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const icon=new Image();icon.src='../assets/gerak-icon.png';
const overview=new Image();overview.src='screens/map-2d.png';
const city=new Image();city.src='screens/map-3d.png';
const clips={};for(const name of ['map-2d','map-3d','journey','budget','community']){const v=document.createElement('video');v.src=`recordings/${name}.mp4`;v.muted=true;v.preload='auto';document.body.append(v);clips[name]=v}
function rr(x,y,w,h,r,fill,stroke){g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=1.5;g.stroke()}}
function text(s,x,y,size=40,col=C.white,weight=500,font='DM',align='left'){g.font=`${weight} ${size}px ${font}`;g.textBaseline='top';g.textAlign=align;g.fillStyle=col;g.fillText(s,x,y)}
function caps(s,x,y,size=17,col=C.muted,space=2.7){g.font=`600 ${size}px DM`;g.fillStyle=col;g.textBaseline='top';g.textAlign='left';for(const c of s){g.fillText(c,x,y);x+=g.measureText(c).width+space}}
function reveal(s,x,y,size,col,t,delay=0){const p=ease((t-delay)/.65);g.save();g.beginPath();g.rect(x-5,y-4,1800,size*1.3);g.clip();g.globalAlpha=p;text(s,x,y+(1-p)*size*1.2,size,col,650,'Space');g.restore()}
function glow(x,y,r,c){const grad=g.createRadialGradient(x,y,0,x,y,r);grad.addColorStop(0,c);grad.addColorStop(1,'#00000000');g.fillStyle=grad;g.fillRect(0,0,W,H)}
function base(t){g.fillStyle=C.bg;g.fillRect(0,0,W,H);glow(1390+Math.sin(t*.3)*50,530,820,'#2252b442');glow(200,1040,500,'#0d3e8a38');g.save();g.globalAlpha=.17;g.fillStyle='#7a9ccc';for(let x=80;x<W;x+=80)for(let y=70;y<H;y+=80)g.fillRect(x,y,1,1);g.restore()}
function logo(x,y,size=48){g.save();g.beginPath();g.roundRect(x,y,size,size,size*.2);g.clip();g.drawImage(icon,x,y,size,size);g.restore()}
function footer(n){caps('GERAK / A BETTER WAY TO MOVE',80,1054,12,'#7189ad',2);text(String(n).padStart(2,'0')+' / 07',1840,1050,17,'#8da4c8',500,'Space','right')}
function credit(){text('Map: OpenFreeMap · OpenMapTiles · OpenStreetMap',960,1054,12,'#7189ad',400,'DM','center')}
function arrow(x,y,size,col=C.white){g.strokeStyle=col;g.lineWidth=size*.1;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(x,y+size);g.lineTo(x+size,y);g.lineTo(x+size,y+size*.75);g.moveTo(x+size,y);g.lineTo(x+size*.25,y);g.stroke()}
function chip(label){g.font='600 16px DM';const w=g.measureText(label).width+43;rr(1815-w,78,w,39,19,'#162748','#3d5f92');text(label,1815-w+22,88,16,'#bad2ff',550)}
function fullScreen(v,t){const p=ease(t/.7);let y=166+(1-p)*45;g.save();g.shadowColor='#00000077';g.shadowBlur=55;g.shadowOffsetY=18;rr(184,y-8,1552,880,22,'#14233b','#4b638b');g.shadowBlur=0;g.shadowOffsetY=0;g.beginPath();g.roundRect(192,y,1536,864,16);g.clip();g.drawImage(v,192,y,1536,864);g.restore()}
function sourceBackdrop(img,opacity=.22,t=0){g.save();g.globalAlpha=opacity;const z=1.12+t*.009;g.translate(960,540);g.scale(z,z);g.drawImage(img,-960,-540,1920,1080);g.restore();const fade=g.createLinearGradient(0,0,W,0);fade.addColorStop(0,'#070d1bf5');fade.addColorStop(.5,'#070d1b8e');fade.addColorStop(1,'#070d1b18');g.fillStyle=fade;g.fillRect(0,0,W,H)}
function intro(t){base(t);g.save();g.globalAlpha=.70;const z=1.24+t*.02;g.translate(1030,530);g.scale(z,z);g.drawImage(overview,-800,-450,1600,900);g.restore();const fade=g.createLinearGradient(0,0,W,0);fade.addColorStop(0,'#070d1b');fade.addColorStop(.36,'#070d1bf2');fade.addColorStop(1,'#070d1b30');g.fillStyle=fade;g.fillRect(0,0,W,H);logo(111,94,65);text('GERAK',193,106,43,C.white,700,'Space');caps('YOUR CITY. CONNECTED.',112,300,23,'#9dbdff',3.5);reveal('A BETTER WAY',105,388,115,C.white,t,.1);reveal('TO MOVE.',105,526,135,C.blue,t,.3);g.save();g.globalAlpha=ease((t-.8)/.6);text('Malaysian mobility, in your hands.',113,720,33,'#c7d7ef',450);g.restore();rr(112,850,485,60,30,'#1c345e','#4266a1');caps('YOUR NEXT MOVE STARTS HERE',141,870,18,'#c4daff',1.8);footer(1);credit()}
function map2d(t){base(t+3);caps('01 / EXPLORE YOUR CITY',112,33,17,'#8fb4fa');reveal('Your city. In 2D.',107,66,67,C.white,t);chip('2D MAP / JOHOR BAHRU');fullScreen(clips['map-2d'],t);footer(2);credit()}
function map3d(t){base(t+9);caps('02 / CHANGE YOUR PERSPECTIVE',112,33,17,'#8fb4fa');reveal('Get closer. In 3D.',107,66,67,C.white,t);chip('3D MAP / FOLLOW A BUS');fullScreen(clips['map-3d'],t);footer(3);credit()}
function journey(t){base(t+15);caps('03 / PLAN YOUR NEXT MOVE',112,33,17,'#8fb4fa');reveal('A journey starts here.',107,66,67,C.white,t);chip('ROUTES / STOPS / FARE ESTIMATES');fullScreen(clips['journey'],t);footer(4);credit()}
function budget(t){base(t+20);sourceBackdrop(clips.budget,.23,t);logo(112,76,49);caps('04 / TRANSPORT BUDGET',185,92,20,'#9dbdff');reveal('Plans that',106,303,111,C.white,t,.08);reveal('add up.',106,434,132,C.blue,t,.22);text('Plan your recurring journeys.',113,647,33,'#d0ddef',450);text('Set your monthly transport budget.',113,699,31,C.muted,450);rr(113,824,680,56,28,'#142945','#2d4e7c');caps('YOUR JOURNEYS. YOUR MONTHLY PLAN.',143,843,18,'#a8c8fc',1.8);g.save();const p=ease(t/.7);g.translate((1-p)*180,0);g.shadowColor='#00000088';g.shadowBlur=55;rr(1093,205,567,780,28,'#18263a','#5575a2');g.shadowBlur=0;g.beginPath();g.roundRect(1105,217,543,756,19);g.clip();g.drawImage(clips.budget,112,78,322,448,1105,217,543,756);g.restore();caps('SAVED / MONTHLY BUDGET',1105,166,17,'#a9c5f3',2);footer(5);text('Example journey preferences · Estimates calculated by GERAK',960,1054,12,'#7189ad',400,'DM','center')}
function community(t){base(t+24);sourceBackdrop(clips.community,.28,t);logo(112,76,49);caps('05 / YOUR COMMUNITY',185,92,20,'#9dbdff');reveal('See it.',106,322,132,C.white,t,.06);reveal('Report it.',106,468,132,C.blue,t,.18);text('A voice for your neighbourhood.',113,680,35,'#c4d5ed',450);text('Share local issues through GERAK.',113,741,29,C.muted,450);g.save();const p=ease(t/.6);g.translate((1-p)*160,0);g.shadowColor='#00000077';g.shadowBlur=45;rr(1060,174,581,838,24,'#18263b','#3b557b');g.shadowBlur=0;g.beginPath();g.roundRect(1068,182,565,822,20);g.clip();g.drawImage(clips.community,520,45,560,810,1068,182,565,822);g.restore();footer(6)}
function outro(t){base(t+27);g.save();g.globalAlpha=.18;g.translate(960,540);g.rotate(-.05);g.drawImage(overview,-1180+20*t,-480,1600,900);g.drawImage(city,460-20*t,-440,1600,900);g.restore();glow(960,550,650,'#1847aa66');g.fillStyle='#070d1b66';g.fillRect(0,0,W,H);g.save();g.globalAlpha=ease(t/.55);logo(468,327,200);text('GERAK',715,315,185,C.white,700,'Space');g.restore();reveal('A better way to move.',510,591,72,'#bed5ff',t,.15);text('Explore. Plan. Connect.',960,716,32,C.muted,450,'DM','center');rr(743,824,434,78,39,'#427bfa','#8eb5ff');caps('LET’S GERAK',806,849,24,C.white,2.5);arrow(1101,849,27);caps('YOUR CITY. YOUR JOURNEY.',686,1007,19,'#87a5d2',3);}
const cuts=[0,3,9,15,20,24,27,30],scenes=[intro,map2d,map3d,journey,budget,community,outro],clipNames=[null,'map-2d','map-3d','journey','budget','community',null];
async function seekVideo(v,t){t=Math.max(0,Math.min(v.duration-.05,t));if(Math.abs(v.currentTime-t)<.002&&v.readyState>=2)return;await new Promise((res,rej)=>{const timer=setTimeout(()=>rej(Error('Video seek timed out: '+v.src)),12000);v.addEventListener('seeked',()=>{clearTimeout(timer);res()},{once:true});v.currentTime=t})}
window.renderFrame=async function(time){const t=Math.max(0,Math.min(29.999,time));let n=0;while(n<6&&t>=cuts[n+1])n++;if(clipNames[n])await seekVideo(clips[clipNames[n]],t-cuts[n]);g.save();scenes[n](t-cuts[n]);g.restore();if(n>0&&t-cuts[n]<.38){const p=sm((t-cuts[n])/.38);g.fillStyle='#5289ff';g.fillRect(W*p,0,W*(1-p),H);g.fillStyle='#9abfff';g.fillRect(W*p-8,0,8,H)}if(t<.2){g.fillStyle=`rgba(7,13,27,${1-ease(t/.2)})`;g.fillRect(0,0,W,H)}if(t>29.7){g.fillStyle=`rgba(7,13,27,${sm((t-29.7)/.3)*.55})`;g.fillRect(0,0,W,H)}return true};
const load=v=>new Promise((res,rej)=>{if(v.readyState>=2)return res();v.addEventListener('loadeddata',res,{once:true});v.addEventListener('error',()=>rej(Error(v.error?.message||'video load error')),{once:true})});
window.ready=Promise.all([document.fonts.load('700 100px Space'),document.fonts.load('500 30px DM'),icon.decode(),overview.decode(),city.decode(),...Object.values(clips).map(load)]).then(()=>renderFrame(1.7));
let playing=false,at=0,start=0;document.getElementById('play').onclick=()=>{playing=!playing;start=performance.now()-at*1000;document.getElementById('play').textContent=playing?'Pause':'Play';if(playing)requestAnimationFrame(tick)};document.getElementById('seek').oninput=async e=>{at=+e.target.value;start=performance.now()-at*1000;await renderFrame(at)};async function tick(now){if(!playing)return;at=(now-start)/1000;if(at>30){at=0;start=now}await renderFrame(at);document.getElementById('seek').value=at;document.getElementById('time').textContent=at.toFixed(1)+' / 30s';requestAnimationFrame(tick)}
</script></html>
