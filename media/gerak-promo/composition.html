<!doctype html>

<style>

<script>

function glow(x,y,r,color){const a=g.createRadialGradient(x,y,0,x,y,r);a.addColorStop(0,color);a.addColorStop(1,'#00000000');g.fillStyle=a;g.fillRect(0,0,W,H)}

  // Entirely original schematic city, with a river and a regular street network.

  for(let i=-2;i<12;i++){let a=i*w/8;line([[a,-100],[a-170,h+100]],'#20314a',12);line([[-100,i*h/7],[w+100,i*h/7-190]],'#20314a',12)}
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){const bx=i*w/8-70-j*9,by=j*h/7+15-i*10;rr(bx,by,w/12,h/12,5,(i+j)%3===0?'#19332e':'#14243b')}
  const pts=[[w*.09,h*.8],[w*.29,h*.8],[w*.4,h*.56],[w*.62,h*.56],[w*.72,h*.29],[w*.9,h*.29]];
  g.shadowColor='#3c76ff';g.shadowBlur=18;line(pts,'#3b77fa',8);g.shadowBlur=0;pts.filter((p,i)=>i%2===0||i===5).forEach(p=>{circle(...p,10,'#11233e','#a3c4ff',4)});
  let f=(t*.10+.12)%1,seg=f*(pts.length-1),k=Math.min(4,Math.floor(seg)),p=seg-k,bx=lerp(pts[k][0],pts[k+1][0],p),by=lerp(pts[k][1],pts[k+1][1],p);
  circle(bx,by,32+Math.sin(t*4)*4,'#3f7dff22');rr(bx-24,by-27,48,54,15,C.blue,'#b8d9ff',2);iconBus(bx,by,.7);g.restore();
}
function phone(x,y,t,scale=1,angle=-.08){g.save();g.translate(x,y);g.rotate(angle);g.scale(scale,scale);g.shadowColor='#00000088';g.shadowBlur=70;g.shadowOffsetY=30;rr(-224,-416,448,832,62,'#080d16','#52617a',3);g.shadowBlur=0;g.shadowOffsetY=0;rr(-211,-403,422,806,51,'#122035');g.save();g.beginPath();g.roundRect(-211,-403,422,806,51);g.clip();mapArt(-211,-280,422,590,t,1.07);rr(-211,-403,422,142,0,'#101c30');txt('9:41',-175,-375,18,C.white,600);rr(-65,-388,130,28,14,'#03070f');line([[143,-365],[153,-365]],C.white,4);line([[160,-369],[160,-362]],C.white,4);rr(169,-373,24,12,3,null,C.white,1.5);rr(171,-371,18,8,2,C.white);g.drawImage(icon,-181,-331,36,36);txt('GERAK',-133,-327,28,C.white,650,'Space');rr(-184,-252,368,58,17,'#f5f8ff');circle(-157,-226,8,null,'#60718a',2);line([[-151,-220],[-145,-214]],'#60718a',2);txt('Where are you headed?',-128,-235,18,'#3c4e68',500);rr(-188,150,376,174,24,'#15233b','#3b5479',1);caps('YOUR CITY, CONNECTED',-164,173,12,'#8faef1',1.5);txt('Explore your next move.',-164,202,24,C.white,650,'Space');rr(-164,247,328,51,14,C.blue);txt('Plan a journey',0,261,19,C.white,650,'DM','center');arrow(132,262,17);rr(-211,343,422,60,0,'#0b1629');['Explore','Routes','Community','Saved'].forEach((s,i)=>txt(s,-157+i*105,362,12,i===0?'#9abdff':'#8496b4',500,'DM','center'));rr(-65,387,130,5,3,'#7890ad');g.restore();rr(-226,-220,4,70,2,'#7386a3');rr(222,-163,4,102,2,'#7386a3');g.restore()}

function scene0(t){back(t);brand();const p=ease(t/1.3);g.save();g.globalAlpha=.7;g.translate((1-p)*600,0);g.beginPath();g.moveTo(980,1150);g.bezierCurveTo(1030,770,1680,970,1620,650);g.bezierCurveTo(1580,430,1280,590,1500,290);g.strokeStyle='#133a8d';g.lineWidth=132;g.lineCap='round';g.stroke();g.setLineDash([25,40]);g.lineDashOffset=-t*140;g.strokeStyle='#5f9bff';g.lineWidth=4;g.stroke();g.restore();caps('LIFE DOESN’T STAND STILL.',108,240,22,'#9ab7f1',3);reveal('YOUR CITY.',98,320,174,C.white,.12,t);reveal('IN MOTION.',98,510,174,'#73a4ff',.5,t);enter(t,.95,()=>{line([[108,765],[185,765]],C.blue,4);txt('Neither should your journey.',213,746,31,'#b7c7e0',400)});g.save();g.globalAlpha=ease((t-1.1)/.6);circle(1580,300,74,'#3d78ff');arrow(1544,265,69);g.restore();foot(1)}

enter(t,.25,()=>{rr(870,228,943,661,36,'#101c30','#37517b',2);mapArt(887,245,909,627,t+2);rr(915,274,300,51,25,'#12223e','#355487');circle(940,299,5,'#8de4e3');txt('Vehicle positions',958,285,22,C.white,550);rr(923,772,540,75,20,'#0b182df2','#35517c');iconBus(955,808,.7,'#8bb3ff');txt('Explore the network',985,790,24,C.white,600);txt('Routes • Stops • Connections',985,823,16,C.muted);pin(1615,444,1.5);});foot(3,false,true)}
function scene3(t){back(t+14,true);brand(true);caps('02 / PLAN AHEAD',108,227,20,'#3569cc',2.5);reveal('Big plans.',101,308,124,C.ink,.05,t);reveal('Smarter budgets.',101,450,90,'#2866df',.22,t);enter(t,.6,()=>{txt('See fare estimates where available.',108,601,29,'#52657f');txt('Build your monthly transport plan.',108,648,29,'#52657f')});enter(t,.9,()=>{pill('FARE ESTIMATES',108,767,232,true);pill('MONTHLY PLANNING',355,767,285,true)});
enter(t,.15,()=>{g.shadowColor='#203f7525';g.shadowBlur=60;g.shadowOffsetY=20;rr(960,218,804,685,36,'#fff');g.shadowBlur=0;g.shadowOffsetY=0;caps('TRANSPORT BUDGET',1004,267,18,'#61718a',2);txt('Make room for more.',1000,312,41,C.ink,650,'Space');rr(1656,261,62,62,19,'#e9effe');line([[1674,288],[1688,301],[1703,278]],'#3970dd',3);txt('PLANNED TRAVEL',1006,397,17,'#6d7e96',600);let p=ease((t-.7)/1.5);txt('RM '+Math.round(84*p),1000,428,89,C.ink,650,'Space');txt('/ RM 120 monthly limit',1005,533,23,'#6b7e96');rr(1004,591,709,19,10,'#e9eef7');rr(1004,591,709*.7*p,19,10,'#427bff');txt('A little planning. More possibility.',1005,636,24,'#4c6284');const vals=[.42,.68,.53,.77];for(let i=0;i<4;i++){const x=1006+i*182;rr(x,710,160,117,17,'#f3f6fb');rr(x+17,785-58*vals[i]*p,126,58*vals[i]*p+9,7,i===3?'#3c78f5':'#bcd0f5');txt('WEEK '+(i+1),x+17,733,14,'#637996',650)}txt('Example plan · Estimated amounts',1005,857,16,'#7e8ea5')});foot(4,true,true)}
function scene4(t){back(t+19);brand();caps('03 / HELP YOUR COMMUNITY',108,227,20,'#8fb6ff',2.5);reveal('Your neighbourhood.',101,310,80,C.white,.05,t);reveal('Your voice.',101,425,125,'#7aaaff',.2,t);enter(t,.6,()=>{txt('Spot a local issue. Share a report.',108,603,29,C.muted);txt('Track its progress in GERAK.',108,648,29,C.muted)});enter(t,.9,()=>pill('SMALL ACTIONS. SHARED PROGRESS.',108,769,497));
enter(t,.25,()=>{rr(1002,222,775,661,34,'#111e33','#2e486c');mapArt(1018,238,743,270,t*.3);g.save();g.globalAlpha=.15;circle(1390,391,94+Math.sin(t*4)*8,'#7dafff');g.restore();pin(1390,400,2.1);rr(1044,484,692,346,26,'#17263f','#3e567c');rr(1076,517,52,52,16,'#263d60');pin(1102,550,.7,'#8cb6ff');txt('Damaged bus stop',1144,517,30,C.white,650,'Space');txt('Community report',1144,557,19,C.muted);line([[1080,611],[1702,611]],'#31496b',1);let p=ease((t-1)/1.3);line([[1106,672],[1661,672]],'#334d70',4);line([[1106,672],[1106+555*p,672]],'#6e9df8',4);['Submitted','Acknowledged','In progress'].forEach((s,i)=>{const x=1106+i*277.5;let active=p>i*.48;circle(x,672,18,active?'#6597ff':'#263e60');if(active)check(x,672,.8);txt(s,x,709,18,active?'#dceaff':'#8a9dbb',500,'DM','center')});txt('A voice for every neighbourhood.',1080,781,22,'#a5bada',450)});foot(5,false,true)}

const cuts=[0,4,9,14,19,24,30],scenes=[scene0,scene1,scene2,scene3,scene4,scene5];
window.renderFrame=(time)=>{const t=clamp(time,0,29.9999);let n=0;while(n<5&&t>=cuts[n+1])n++;g.save();scenes[n](t-cuts[n]);g.restore();if(n>0&&t-cuts[n]<.48){const p=smooth((t-cuts[n])/.48);g.save();g.beginPath();g.rect(W*p,0,W*(1-p),H);g.clip();scenes[n-1](cuts[n]-cuts[n-1]+t-cuts[n]);g.restore();g.fillStyle=n===3?'#9bbcff':'#4e86ff';g.fillRect(W*p-18,0,22,H)}if(t<.25){g.fillStyle=`rgba(7,13,27,${1-ease(t/.25)})`;g.fillRect(0,0,W,H)}if(t>29.75){g.fillStyle=`rgba(7,13,27,${smooth((t-29.75)/.25)*.65})`;g.fillRect(0,0,W,H)}return true};
window.ready=Promise.all([document.fonts.load('700 100px Space'),document.fonts.load('500 30px DM'),icon.decode()]).then(()=>renderFrame(2));
let playing=false,start=0,at=0;const btn=document.getElementById('play'),seek=document.getElementById('seek');btn.onclick=()=>{playing=!playing;start=performance.now()-at*1000;btn.textContent=playing?'Pause':'Play preview';if(playing)requestAnimationFrame(tick)};seek.oninput=()=>{at=+seek.value;start=performance.now()-at*1000;renderFrame(at);document.getElementById('time').textContent=at.toFixed(1)+' / 30s'};function tick(now){if(!playing)return;at=(now-start)/1000;if(at>=30){at=0;start=now}renderFrame(at);seek.value=at;document.getElementById('time').textContent=at.toFixed(1)+' / 30s';requestAnimationFrame(tick)}
</script></html>
