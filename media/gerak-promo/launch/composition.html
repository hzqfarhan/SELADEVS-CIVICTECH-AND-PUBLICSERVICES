<!doctype html><html lang="en"><meta charset="utf-8"><title>GERAK — Your journey. Your voice.</title>
<style>
@font-face{font-family:Space;src:url('../assets/SpaceGrotesk.ttf');font-weight:300 700}@font-face{font-family:DM;src:url('../assets/DMSans.ttf');font-weight:100 1000}
body{margin:0;background:#080e19;display:grid;place-items:center;min-height:100vh}canvas{width:min(100vw,177.777vh);height:auto}video{display:none}#controls{position:fixed;bottom:12px;padding:10px 18px;border-radius:30px;color:#d8e6ff;background:#14223c;font:14px DM}button{background:#5288fb;color:white;border:0;padding:8px 20px;border-radius:20px;cursor:pointer}input{width:280px;vertical-align:middle}
</style><canvas id="film" width="1920" height="1080"></canvas><div id="controls"><button id="play">Play</button> <input id="seek" type="range" min="0" max="29.96" step=".033" value="0"> <span id="time">0.0 / 30s</span> · GERAK launch film</div>
<script>
const cv=document.getElementById('film'),g=cv.getContext('2d',{alpha:false}),W=1920,H=1080;
const C={bg:'#080e19',white:'#f3f7ff',muted:'#b5c7df',blue:'#82b1ff',cyan:'#68dfeb',line:'#365275'};
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-(1-clamp(x))**3,smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const imgs={};for(const [key,path] of Object.entries({icon:'../assets/gerak-icon.png',form:'screens/report-form-hires.png',submitted:'screens/submitted-card.png',resident:'screens/acknowledged-card-hires.png',operator:'screens/operator-ack-hires.png',location:'screens/civic-map.png'})){const im=new Image();im.src=path;imgs[key]=im}
const clips={};for(const name of ['bus-3d','bus-2d-fixed','civic-send','civic-ack']){const v=document.createElement('video');v.src=`recordings/${name}.mp4`;v.muted=true;v.preload='auto';document.body.append(v);clips[name]=v}
function rr(x,y,w,h,r,fill,stroke){g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=1.5;g.stroke()}}
function txt(s,x,y,size=40,col=C.white,weight=500,font='DM',align='left'){g.font=`${weight} ${size}px ${font}`;g.textBaseline='top';g.textAlign=align;g.fillStyle=col;g.fillText(s,x,y)}
function caps(s,x,y,size=18,col=C.muted,space=2.8){g.font=`600 ${size}px DM`;g.fillStyle=col;g.textBaseline='top';g.textAlign='left';for(const c of s){g.fillText(c,x,y);x+=g.measureText(c).width+space}}
function reveal(s,x,y,size,col,t,delay=0){const p=ease((t-delay)/.55);g.save();g.beginPath();g.rect(x-4,y-4,1800,size*1.25);g.clip();g.globalAlpha=p;txt(s,x,y+(1-p)*size,size,col,650,'Space');g.restore()}
function logo(x,y,size){g.save();g.beginPath();g.roundRect(x,y,size,size,size*.22);g.clip();g.drawImage(imgs.icon,x,y,size,size);g.restore()}
function glow(x,y,r,col){const a=g.createRadialGradient(x,y,0,x,y,r);a.addColorStop(0,col);a.addColorStop(1,'#00000000');g.fillStyle=a;g.fillRect(0,0,W,H)}
function base(t){g.fillStyle=C.bg;g.fillRect(0,0,W,H);glow(1450,400,950,'#1c4a9840');glow(200,1080,700,'#193c762f');g.save();g.globalAlpha=.14;g.fillStyle='#9ab8df';for(let x=96;x<W;x+=64)for(let y=96;y<H;y+=64)g.fillRect(x,y,1,1);g.restore()}
function brand(){logo(96,59,49);txt('GERAK',159,65,34,C.white,700,'Space')}
function pill(s,x,y,w){rr(x,y,w,42,21,'#111e32e8','#52698b');txt(s,x+w/2,y+11,17,'#d4e2f7',600,'DM','center')}
function credits(civic=false){txt(civic?'Civic workflow demonstration · GERAK operator inbox':'Recorded 16 Oct 2026 · Official GPS observations · Time condensed',96,1038,17,'#a6bad5');txt('Map: OpenFreeMap · OpenMapTiles · OpenStreetMap',1824,1038,16,'#a6bad5',400,'DM','right')}
function routeAccent(t,y=990){g.strokeStyle='#3d5b80';g.lineWidth=2;g.beginPath();g.moveTo(96,y);g.lineTo(1824,y);g.stroke();const x=96+1728*clamp(t/30);g.strokeStyle=C.blue;g.lineWidth=3;g.beginPath();g.moveTo(96,y);g.lineTo(x,y);g.stroke();g.fillStyle=C.cyan;g.beginPath();g.arc(x,y,5,0,7);g.fill()}
function mapFilm(v,zoom=1,cx=850,cy=460){g.save();g.translate(W/2,H/2);g.scale(zoom,zoom);g.drawImage(v,100,78,1500,784,-960,-502,1920,1004);g.restore();const a=g.createLinearGradient(0,0,0,H);a.addColorStop(0,'#050b16f5');a.addColorStop(.23,'#050b16a0');a.addColorStop(.43,'#050b1600');a.addColorStop(.77,'#050b1600');a.addColorStop(1,'#050b16f5');g.fillStyle=a;g.fillRect(0,0,W,H)}
function mapScene(t,n){base(t);const v=clips[n===1?'bus-2d-fixed':'bus-3d'];mapFilm(v,n===0?1.12:1);brand();pill(n===1?'2D / JOHOR BAHRU':'3D / FOLLOW THE JOURNEY',1450,62,374);if(n===0){caps('INTRODUCING GERAK',100,170,20,C.blue);reveal('Every journey',94,214,108,C.white,t,.03);reveal('matters.',94,338,126,C.blue,t,.12)}else if(n===1){caps('01 / YOUR JOURNEY',100,159,19,C.blue);reveal('See your bus move.',94,203,95,C.white,t);txt('A clearer picture of the road ahead.',100,320,30,C.muted)}else{caps('THE SAME BUS. A CLOSER VIEW.',100,159,19,C.blue);reveal('Follow the journey.',94,203,95,C.white,t);txt('Your city, in motion.',100,320,30,C.muted)}routeAccent(n===0?t:n===1?t+3:t+8);credits()}
function panel(img,sx,sy,sw,sh,dx,dy,dw,dh,r=24){g.save();g.shadowColor='#00000088';g.shadowBlur=50;g.shadowOffsetY=18;rr(dx-8,dy-8,dw+16,dh+16,r+7,'#182940','#42608b');g.shadowBlur=0;g.shadowOffsetY=0;g.beginPath();g.roundRect(dx,dy,dw,dh,r);g.clip();g.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh);g.restore()}
function issue(t){base(t);brand();pill('COMMUNITY DEMONSTRATION',1450,62,374);caps('02 / YOUR NEIGHBOURHOOD',100,214,19,C.blue);reveal('Make local',94,274,99,C.white,t);reveal('issues visible.',94,390,99,C.blue,t,.12);txt('The journey includes the walk to the stop.',100,572,29,C.muted);rr(100,678,665,126,22,'#12243c','#36577e');caps('EXAMPLE / UNSAFE WALKWAY',126,702,17,C.blue,1.6);txt('A blocked path near a bus stop.',126,739,29,C.white);panel(imgs.location,575,78,924,784,925,180,899,760);g.save();g.strokeStyle='#82b1ff';g.lineWidth=3;g.globalAlpha=.7*(1-(t*.75)%1);g.beginPath();g.arc(1209,572,22+((t*.75)%1)*45,0,7);g.stroke();g.restore();routeAccent(t+14);credits(true)}
function report(t){base(t);brand();pill('COMMUNITY DEMONSTRATION',1450,62,374);caps('A SMALL ACT. A BETTER CITY.',100,228,19,C.blue);reveal('Give your',94,285,95,C.white,t);reveal('neighbourhood',94,393,83,C.white,t,.09);reveal('a voice.',94,498,112,C.blue,t,.18);txt('Choose the issue. Add the location.',100,700,29,C.muted);txt('Share what needs attention.',100,745,29,C.muted);if(t<2.85){panel(imgs.form,0,0,1120,1620,1122,149,583,843);const p=smooth((t-1.7)/.55);if(p>0){g.strokeStyle=`rgba(130,177,255,${p*.8})`;g.lineWidth=3;g.beginPath();g.roundRect(1254,893,418,47,12);g.stroke()}}else{panel(imgs.submitted,0,0,306,209,1040,310,744,508);caps('REPORT SUBMITTED',1080,203,20,C.cyan);txt('Your concern is on the map.',100,856,31,C.cyan,550)}routeAccent(t+18);credits(true)}
function response(t){base(t);brand();pill('COMMUNITY DEMONSTRATION',1450,62,374);caps('03 / A VISIBLE RESPONSE',100,160,19,C.blue);reveal('A voice that can be heard.',94,202,82,C.white,t);caps('GERAK OPERATOR INBOX',128,340,20,C.blue,2);t<1.5?panel(clips['civic-ack'],121,613,306,264,128,380,640,552):panel(imgs.operator,0,0,imgs.operator.width,imgs.operator.height,128,380,640,552);const p=ease((t-2.2)/.6);g.save();g.globalAlpha=p;caps('YOUR COMMUNITY',1152,340,20,C.cyan,2);panel(imgs.resident,0,0,612,418,1152,380,640,437);g.restore();g.strokeStyle='#7aaaff';g.lineWidth=4;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(900,610);g.lineTo(1015,610);g.moveTo(994,589);g.lineTo(1015,610);g.lineTo(994,631);g.stroke();txt(t<2.2?'A local concern reaches the operator.':'Acknowledged — and visible to the community.',960,949,29,t<2.2?C.muted:C.cyan,500,'DM','center');routeAccent(t+22);credits(true)}
function end(t){base(t);glow(960,500,750,'#2455b54d');const p=ease(t/.6);g.save();g.globalAlpha=p;g.font='700 182px Space';const bw=228+g.measureText('GERAK').width,bx=(W-bw)/2;logo(bx,267,180);txt('GERAK',bx+228,255,182,C.white,700,'Space');g.restore();reveal('Your journey.',658,528,91,C.white,t,.12);reveal('Your voice.',691,635,104,C.blue,t,.24);caps('LET’S MOVE FORWARD, TOGETHER.',610,825,23,'#c5d8f5',2.2);g.strokeStyle='#719df5';g.lineWidth=4;g.beginPath();g.moveTo(410,912);g.bezierCurveTo(680,1008,1240,1008,1510,912);g.stroke();const u=ease(t/2.6),x=(1-u)**3*410+3*(1-u)**2*u*680+3*(1-u)*u*u*1240+u**3*1510,y=(1-u)**3*912+3*(1-u)**2*u*1008+3*(1-u)*u*u*1008+u**3*912;g.fillStyle=C.cyan;g.beginPath();g.arc(x,y,7,0,7);g.fill()}
async function seek(v,t){t=Math.max(.001,Math.min(v.duration-.06,t));if(Math.abs(v.currentTime-t)<.002&&v.readyState>=2)return;await new Promise((ok,bad)=>{const timer=setTimeout(()=>bad(Error('Seek timed out')),15000);v.addEventListener('seeked',()=>{clearTimeout(timer);ok()},{once:true});v.currentTime=t})}
const cuts=[0,3,8,14,18,22,27,30];
window.renderFrame=async function(time){const t=Math.max(0,Math.min(29.999,time));let n=0;while(n<6&&t>=cuts[n+1])n++;const local=t-cuts[n];if(n===0)await seek(clips['bus-3d'],local);if(n===1)await seek(clips['bus-2d-fixed'],local+.4);if(n===2)await seek(clips['bus-3d'],local+3.5);if(n===4)await seek(clips['civic-send'],Math.min(local,2.75));if(n===5)await seek(clips['civic-ack'],Math.min(local,3.9));if(n===6)await seek(clips['bus-3d'],6+t-27);g.save();if(n<3)mapScene(local,n);else [issue,report,response,end][n-3](local);g.restore();if(n>0&&local<.24){g.fillStyle=`rgba(130,177,255,${(1-ease(local/.24))*.22})`;g.fillRect(0,0,W,H)}return true};
const load=v=>new Promise((ok,bad)=>{if(v.readyState>=2)return ok();v.addEventListener('loadeddata',ok,{once:true});v.addEventListener('error',()=>bad(Error('Clip not found: '+v.src)),{once:true})});
window.ready=Promise.all([document.fonts.load('700 100px Space'),document.fonts.load('500 30px DM'),...Object.values(imgs).map(i=>i.decode()),...Object.values(clips).map(load)]).then(()=>renderFrame(1.8));
let playing=false,at=0,start=0;document.getElementById('play').onclick=()=>{playing=!playing;start=performance.now()-at*1000;document.getElementById('play').textContent=playing?'Pause':'Play';if(playing)requestAnimationFrame(tick)};document.getElementById('seek').oninput=async e=>{at=+e.target.value;start=performance.now()-at*1000;await renderFrame(at)};async function tick(now){if(!playing)return;at=(now-start)/1000;if(at>30){at=0;start=now}await renderFrame(at);document.getElementById('seek').value=at;document.getElementById('time').textContent=at.toFixed(1)+' / 30s';requestAnimationFrame(tick)}
</script></html>
