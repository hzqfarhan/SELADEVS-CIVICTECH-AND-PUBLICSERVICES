services:
  gerak:
    build: .
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://gerak:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/gerak
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?set OPERATOR_PASSWORD}
      ALLOW_DEMO_OPERATOR: "false"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes: ["runtime:/app/.runtime"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: gerak
      POSTGRES_USER: gerak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gerak -d gerak"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres:
  runtime:
